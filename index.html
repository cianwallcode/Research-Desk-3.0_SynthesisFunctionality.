<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RESEARCH DESK | V7.5</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root { --accent: #ff6b00; --nav-h: 70px; --sidebar: 400px; }
        body, html { margin: 0; padding: 0; font-family: 'Inter', sans-serif; height: 100%; overflow: hidden; background: #fff; }

        /* NAVIGATION */
        nav { background: #000; color: white; display: flex; align-items: center; padding: 0 30px; height: var(--nav-h); z-index: 2000; position: fixed; top: 0; width: 100%; border-bottom: 1px solid #333; }
        .logo { font-weight: 900; cursor: pointer; font-size: 1.3rem; letter-spacing: -1px; text-transform: uppercase; }
        .logo span { color: var(--accent); }
        .nav-tabs { display: flex; gap: 20px; margin-left: 40px; }
        .nav-btn { color: #666; font-size: 10px; font-weight: 800; text-transform: uppercase; background: none; border: none; cursor: pointer; letter-spacing: 1px; }
        .nav-btn.active { color: white; border-bottom: 3px solid var(--accent); padding-bottom: 8px; }

        /* PAGE VIEWS */
        .page-view { display: none; position: absolute; top: var(--nav-h); width: 100%; height: calc(100vh - var(--nav-h)); background: white; z-index: 1000; overflow-y: auto; }
        #view-gis { display: flex; padding: 0; z-index: 1100; }

        /* LANDING */
        .hero { text-align: center; max-width: 700px; margin: 120px auto; padding: 20px; }
        .hero h1 { font-size: 56px; letter-spacing: -2px; line-height: 1; }
        .start-btn { background: var(--accent); color: white; border: none; padding: 20px 40px; font-weight: 900; text-transform: uppercase; cursor: pointer; margin-top: 30px; }

        /* SIDEBAR & FILTERS */
        #synthesis-station { width: var(--sidebar); background: #fcfcfc; border-right: 1px solid #eee; padding: 30px; overflow-y: auto; z-index: 100; }
        .ws-label { font-size: 9px; font-weight: 900; color: var(--accent); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
        .ws-header { border-bottom: 5px solid var(--accent); padding-bottom: 10px; margin-bottom: 20px; }
        .filter-group { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 30px; }
        .tag-pill { background: #eee; padding: 6px 12px; font-size: 10px; font-weight: 900; border-radius: 2px; border: 1px solid #ddd; cursor: pointer; text-transform: uppercase; }
        .tag-pill:hover { background: #e0e0e0; }

        /* MAP */
        #map { flex: 1; height: 100%; background: #f0f0f0; }

        /* CONTROLS */
        .control-panel { background: #f3f3f3; padding: 15px; border-radius: 2px; margin-top: 15px; }
        .toggle-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-size: 11px; font-weight: 800; text-transform: uppercase; }
        .btn-reset { background: #444; color: white; border: none; padding: 15px; width: 100%; font-weight: 900; text-transform: uppercase; cursor: pointer; margin-top: 10px; }

        footer { position: fixed; bottom: 0; width: 100%; background: #fff; border-top: 1px solid #eee; padding: 10px 30px; font-size: 10px; color: #bbb; z-index: 2001; display: flex; justify-content: space-between; }
    </style>
</head>
<body>

    <nav>
        <div class="logo" onclick="resetMap(); showPage('landing');">RESEARCH<span>DESK</span></div>
        <div class="nav-tabs">
            <button class="nav-btn active" id="tab-landing" onclick="showPage('landing')">01. Landing</button>
            <button class="nav-btn" id="tab-gis" onclick="showPage('gis')">02. GIS Analysis</button>
        </div>
    </nav>

    <div class="viewport">
        <div id="view-landing" class="page-view" style="display:block;">
            <div class="hero">
                <h1>Architectural <br>Analysis <span>Desk</span></h1>
                <p>Synthesis of site heritage and environmental flood risk mapping.</p>
                <button class="start-btn" onclick="showPage('gis')">Start Project</button>
            </div>
        </div>

        <div id="view-gis" class="page-view">
            <aside id="synthesis-station">
                <div class="ws-label">Global Filters</div>
                <div class="filter-group">
                    <button class="tag-pill" onclick="filterMap('all')">All</button>
                    <button class="tag-pill" onclick="filterMap('Cistercian')">Cistercian</button>
                    <button class="tag-pill" onclick="filterMap('Museum')">Museum</button>
                    <button class="tag-pill" onclick="filterMap('Modernist')">Modernist</button>
                </div>

                <div class="ws-label">Site Synthesis</div>
                <div class="ws-header"><h2 id="ws-title">Select Pin</h2></div>
                <div id="ws-body"><p style="color:#888; font-size:13px;">Interact with the map pins to zoom.</p></div>

                <div id="analysis-controls" style="display:none;">
                    <div class="control-panel">
                        <div class="toggle-row"><span>Boundary</span><input type="checkbox" id="tog-bound" checked onchange="updateToggles()"></div>
                        <div class="toggle-row"><span>Flood Risk</span><input type="checkbox" id="tog-flood" checked onchange="updateToggles()"></div>
                    </div>
                    <button class="btn-reset" onclick="resetMap()">Reset Map</button>
                </div>
            </aside>
            <div id="map"></div>
        </div>
    </div>

    <footer>
        <span>&copy; 2026 ARCHITECTURAL RESEARCH DESK</span>
        <span>BRanding: Orange/White | CONTACT: RESEARCH@DESK.IE</span>
    </footer>

    <script src="database.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        let map, markers, borderLayer, floodLayer, activeSite = null;

        function init() {
            map = L.map('map', { zoomControl: false }).setView([53.4, -7.8], 7);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png').addTo(map);
            
            markers = L.layerGroup().addTo(map);
            borderLayer = L.layerGroup().addTo(map);
            floodLayer = L.layerGroup().addTo(map);

            renderPins(siteData);
        }

        function renderPins(data) {
            markers.clearLayers();
            data.forEach(s => {
                const m = L.circleMarker(s.coords, { radius: 11, color: '#000', weight: 3, fillColor: '#ff6b00', fillOpacity: 1 }).addTo(markers);
                
                const popupHTML = `
                    <div style="text-align:center; min-width:120px;">
                        <b style="font-size:14px;">${s.name}</b><br>
                        <button onclick="zoomToSite(${s.id})" style="background:#ff6b00; color:white; border:none; padding:8px 12px; margin-top:10px; cursor:pointer; font-weight:800; font-size:10px; text-transform:uppercase;">Zoom to Analysis</button>
                    </div>
                `;
                m.bindPopup(popupHTML);
                m.on('click', () => updateSidebar(s));
            });
        }

        function filterMap(cat) {
            const filtered = (cat === 'all') ? siteData : siteData.filter(s => s.bucket === cat);
            renderPins(filtered);
            resetMap(); // Clears any active site views when filtering
        }

        function updateSidebar(s) {
            document.getElementById('ws-title').innerText = s.name;
            document.getElementById('ws-body').innerHTML = `
                <p style="font-size:10px; font-weight:900; color:var(--accent); text-transform:uppercase;">${s.bucket} // ${s.style}</p>
                <p style="font-size:13px; line-height:1.5; color:#555;">${s.notes}</p>
            `;
        }

        function zoomToSite(id) {
            const s = siteData.find(item => item.id === id);
            if(!s) return;
            activeSite = s;
            map.closePopup();
            map.flyTo(s.coords, 18, { duration: 1.5 });
            document.getElementById('analysis-controls').style.display = "block";
            
            borderLayer.clearLayers();
            if(s.boundary) L.polygon(s.boundary, { color: 'red', weight: 2, dashArray: '5, 10', fillOpacity: 0 }).addTo(borderLayer);
            
            floodLayer.clearLayers();
            if(s.flood_zone) L.polygon(s.flood_zone, { color: '#0077ff', weight: 0, fillOpacity: 0.4 }).addTo(floodLayer);
        }

        function updateToggles() {
            const b = document.getElementById('tog-bound').checked;
            const f = document.getElementById('tog-flood').checked;
            if(b) map.addLayer(borderLayer); else map.removeLayer(borderLayer);
            if(f) map.addLayer(floodLayer); else map.removeLayer(floodLayer);
        }

        function resetMap() {
            map.flyTo([53.4, -7.8], 7);
            borderLayer.clearLayers();
            floodLayer.clearLayers();
            document.getElementById('analysis-controls').style.display = "none";
            document.getElementById('ws-title').innerText = "Select Pin";
            document.getElementById('ws-body').innerHTML = `<p style="color:#888; font-size:13px;">Interact with the map pins to zoom.</p>`;
        }

        function showPage(p) {
            document.querySelectorAll('.page-view').forEach(v => v.style.display = 'none');
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('view-' + p).style.display = (p === 'gis') ? 'flex' : 'block';
            document.getElementById('tab-' + p).classList.add('active');
            if(p === 'gis') setTimeout(() => map.invalidateSize(), 200);
        }

        window.onload = init;
    </script>
</body>
</html>
