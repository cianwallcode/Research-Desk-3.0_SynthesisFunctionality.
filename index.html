<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RESEARCH DESK | V4.5</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root { --accent: #ff6b00; --bg: #ffffff; --text: #1a1a1a; --border: #e0e0e0; --nav-h: 60px; --side: 65px; }
        body, html { margin: 0; padding: 0; font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); height: 100%; overflow: hidden; }

        /* NAVIGATION */
        nav { background: #1a1a1a; color: white; display: none; align-items: center; padding: 0 20px; height: var(--nav-h); z-index: 1000; position: sticky; top:0; }
        .logo { font-weight: 900; cursor: pointer; font-size: 1.2rem; letter-spacing: -1px; }
        .logo span { color: var(--accent); }
        .nav-tabs { margin-left: auto; display: flex; }
        .nav-tab { background: none; border: none; color: #888; cursor: pointer; font-size: 11px; font-weight: 700; text-transform: uppercase; padding: 10px; margin-left: 10px; }
        .nav-tab.active { color: var(--accent); border-bottom: 2px solid var(--accent); }

        /* LANDING */
        #page-landing { position: fixed; inset: 0; background: white; z-index: 9999; overflow-y: auto; text-align: center; }
        .hero { height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .primary-btn { background: var(--accent); color: white; border: none; padding: 16px 32px; cursor: pointer; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; transition: 0.2s; }
        .primary-btn:hover { transform: translateY(-2px); filter: brightness(1.1); }

        /* LAYOUT */
        .main-container { display: flex; height: calc(100vh - var(--nav-h)); }
        .resource-bar { width: var(--side); background: #f4f4f4; border-right: 1px solid var(--border); display: none; flex-direction: column; align-items: center; padding-top: 25px; gap: 20px; }
        .res-icon { width: 35px; height: 35px; background: #ddd; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 900; color: #666; text-decoration: none; }
        .res-icon:hover { background: var(--accent); color: white; }

        .page-content { display: none; flex: 1; height: 100%; overflow-y: auto; }
        .page-content.active { display: flex !important; }

        /* MAP & SIDEBAR */
        #sidebar { width: 320px; border-right: 1px solid var(--border); padding: 25px; background: #fff; z-index: 10; }
        #map { flex: 1; z-index: 1; background: #f9f9f9; }
        .card { background: white; padding: 20px; border: 1px solid var(--border); border-top: 4px solid var(--accent); margin-bottom: 20px; border-radius: 2px; }

        /* TABLES & COMPARE */
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; color: var(--accent); border-bottom: 2px solid var(--accent); padding: 12px; font-size: 11px; }
        td { padding: 12px; border-bottom: 1px solid var(--border); font-size: 13px; }
        .comp-column { flex: 1; padding: 30px; border-right: 1px solid var(--border); background: #fafafa; }
        select { width: 100%; padding: 12px; border: 1px solid var(--border); margin-bottom: 20px; }

        /* LEAFLET OVERRIDES */
        .leaflet-control-layers { border: 2px solid var(--accent) !important; font-weight: bold; text-transform: uppercase; font-size: 10px; }
    </style>
</head>
<body>

    <div id="page-landing">
        <div class="hero">
            <h1 style="font-size: 4.5rem; letter-spacing: -4px; margin:0; font-weight:900;">RESEARCH<span>DESK</span></h1>
            <p style="color:#888; letter-spacing:8px; margin: 10px 0 40px 0;">SITE DATA SYNTHESIS ENGINE</p>
            <button class="primary-btn" onclick="initApp()">START PROJECT</button>
        </div>
        <footer style="padding: 60px; background: #f9f9f9; border-top: 1px solid #eee; font-size: 12px; color: #aaa;">
            <p>© 2026 RESEARCH DESK | CONTACT: STUDIO@RESEARCHDESK.IE</p>
        </footer>
    </div>

    <nav id="main-nav">
        <div class="logo" onclick="goHome()">RESEARCH<span>DESK</span></div>
        <div class="nav-tabs">
            <button class="nav-tab active" id="tab-map" onclick="showPage('map')">Map</button>
            <button class="nav-tab" id="tab-database" onclick="showPage('database')">Inventory</button>
            <button class="nav-tab" id="tab-compare" onclick="showPage('compare')">Comparison</button>
            <button class="nav-tab" id="tab-synthesis" onclick="showPage('synthesis')">Analysis Dashboard</button>
        </div>
    </nav>

    <div class="main-container">
        <aside class="resource-bar" id="res-bar">
            <a href="https://www.buildingsofireland.ie/" target="_blank" class="res-icon" title="NIAH">NI</a>
            <a href="http://soils.teagasc.ie/" target="_blank" class="res-icon" title="Teagasc">TG</a>
            <a href="https://www.floodinfo.ie/" target="_blank" class="res-icon" title="Flood Info">FL</a>
        </aside>

        <div id="page-map" class="page-content active" style="flex-direction:row; overflow:hidden;">
            <div id="sidebar">
                <h3 id="side-name" style="margin-top:0;">Site Selection</h3>
                <div id="side-info"><p style="color:#aaa;">Use the layer toggle (top-right) to activate Flood and Soil data.</p></div>
            </div>
            <div id="map"></div>
        </div>

        <div id="page-database" class="page-content" style="padding:40px; flex-direction:column;">
            <h2>Project Inventory</h2>
            <table id="db-table">
                <thead><tr><th>NAME</th><th>TYPE</th><th>STYLE</th><th>STATUS</th></tr></thead>
                <tbody id="db-body"></tbody>
            </table>
        </div>

        <div id="page-compare" class="page-content">
            <div class="comp-column">
                <select id="sel-a" onchange="doCompare()"></select>
                <div id="res-a"></div>
            </div>
            <div class="comp-column">
                <select id="sel-b" onchange="doCompare()"></select>
                <div id="res-b"></div>
            </div>
        </div>

        <div id="page-synthesis" class="page-content" style="padding:40px; flex-direction:column; background:#f4f4f4;">
            <h2 id="syn-title">Dashboard</h2>
            <div id="analysis-grid" style="display:grid; grid-template-columns: 1fr 1fr; gap:20px; margin-top:20px;"></div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        let map, sites = [], selectedSite = null;

        async function initApp() {
            document.getElementById('page-landing').style.display = 'none';
            document.getElementById('main-nav').style.display = 'flex';
            document.getElementById('res-bar').style.display = 'flex';
            
            try {
                const resp = await fetch('database.json');
                sites = await resp.json();
                
                if(!map) {
                    map = L.map('map', {zoomControl: false}).setView([53.4, -7.9], 7);
                    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png').addTo(map);

                    // LIVE WMS LAYERS
                    const floodLayer = L.tileLayer.wms("https://maps.opw.ie/arcgis/services/Flood_Risk/Flood_Maps/MapServer/WMSServer", {
                        layers: '0', format: 'image/png', transparent: true, opacity: 0.5, version: '1.3.0'
                    });

                    const soilLayer = L.tileLayer.wms("https://gis.teagasc.ie/soils/wms.php", {
                        layers: 'p_survey', format: 'image/png', transparent: true, opacity: 0.4
                    });

                    const overlays = { "Flood Risk (OPW)": floodLayer, "Soils (Teagasc)": soilLayer };
                    L.control.layers(null, overlays, {collapsed: false}).addTo(map);
                }

                // Render Pins
                sites.forEach(s => {
                    if(s.coords) {
                        let m = L.circleMarker(s.coords, {radius:10, color:'white', fillColor:'#ff6b00', fillOpacity:1, weight:2}).addTo(map);
                        m.bindPopup(`<strong>${s.name}</strong><br>${s.bucket}`);
                        m.on('click', () => {
                            selectedSite = s;
                            document.getElementById('side-name').innerText = s.name;
                            document.getElementById('side-info').innerHTML = `
                                <div class="card">
                                    <p><strong>Status:</strong> ${s.status}</p>
                                    <button class="primary-btn" style="width:100%" onclick="runAnalysis()">Analyze Dashboard</button>
                                </div>`;
                        });
                    }
                });

                populateInventory(); populateSelectors();
            } catch (e) { console.error("Data Load Error:", e); }
        }

        function goHome() { 
            document.getElementById('page-landing').style.display = 'block'; 
            document.getElementById('main-nav').style.display = 'none'; 
            document.getElementById('res-bar').style.display = 'none'; 
        }

        function populateInventory() {
            document.getElementById('db-body').innerHTML = sites.map(s => `<tr><td>${s.name}</td><td>${s.bucket}</td><td>${s.style}</td><td>${s.status}</td></tr>`).join('');
        }

        function populateSelectors() {
            const opts = sites.map(s => `<option value="${s.id}">${s.name}</option>`).join('');
            document.getElementById('sel-a').innerHTML = opts;
            document.getElementById('sel-b').innerHTML = opts;
            doCompare();
        }

        function doCompare() {
            const a = sites.find(s => s.id == document.getElementById('sel-a').value);
            const b = sites.find(s => s.id == document.getElementById('sel-b').value);
            const render = (s) => `
                <div class="card">
                    <img src="${s.plan_url}" style="width:100%; height:200px; object-fit:contain; background:#eee;" onerror="this.src='https://via.placeholder.com/300x200?text=Plan+Not+Found'">
                    <h4>${s.name}</h4>
                    <p style="font-size:12px;">Plan: ${s.plan_type}</p>
                </div>`;
            document.getElementById('res-a').innerHTML = render(a);
            document.getElementById('res-b').innerHTML = render(b);
        }

        function runAnalysis() {
            showPage('synthesis');
            const s = selectedSite;
            document.getElementById('syn-title').innerText = s.name;
            const isOpp = (s.flood_risk === "Low" && s.status.toLowerCase() === "derelict");
            document.getElementById('analysis-grid').innerHTML = `
                <div class="card" style="border-top-color: ${isOpp ? '#27ae60' : '#e74c3c'}">
                    <h3>Strategic Conclusion</h3>
                    <p>${isOpp ? 'HIGH OPPORTUNITY: Low flood risk + derelict status.' : 'CONSTRAINED: Review flood zones or active status.'}</p>
                </div>
                <div class="card"><h3>Site Details</h3><p>${s.bucket} | ${s.style}</p></div>
            `;
        }

        function showPage(id) {
            document.querySelectorAll('.page-content').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
            document.getElementById('page-' + id).classList.add('active');
            document.getElementById('tab-' + id).classList.add('active');
            if(id === 'map') setTimeout(() => map.invalidateSize(), 200);
        }
    </script>
</body>
</html>
