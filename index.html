<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RESEARCH DESK | V6.3 ENVIRONMENTAL</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root { --accent: #ff6b00; --flood: #0077ff; --nav-h: 70px; --sidebar: 400px; }
        body, html { margin: 0; padding: 0; font-family: 'Inter', sans-serif; height: 100%; overflow: hidden; background: #fff; }

        /* NAVIGATION */
        nav { background: #000; color: white; display: flex; align-items: center; padding: 0 30px; height: var(--nav-h); z-index: 2000; position: fixed; top: 0; width: 100%; }
        .logo { font-weight: 900; cursor: pointer; font-size: 1.3rem; letter-spacing: -1px; text-transform: uppercase; }
        .logo span { color: var(--accent); }
        .nav-tabs { display: flex; gap: 20px; margin-left: 40px; }
        .nav-btn { color: #666; font-size: 10px; font-weight: 800; text-transform: uppercase; background: none; border: none; cursor: pointer; letter-spacing: 1px; }
        .nav-btn.active { color: white; border-bottom: 3px solid var(--accent); padding-bottom: 8px; }

        /* VIEWPORT & SIDEBAR */
        .viewport { display: flex; padding-top: var(--nav-h); height: calc(100vh - var(--nav-h)); }
        #synthesis-station { width: var(--sidebar); background: #fdfdfd; border-right: 1px solid #eee; padding: 30px; overflow-y: auto; z-index: 100; }
        .ws-header { border-bottom: 5px solid var(--accent); padding-bottom: 15px; margin-bottom: 25px; }
        
        /* TOGGLE SWITCHES */
        .control-panel { background: #f0f0f0; padding: 15px; margin-top: 20px; border-radius: 4px; }
        .toggle-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-size: 11px; font-weight: 800; text-transform: uppercase; }
        
        /* MAP AREA */
        #map { flex: 1; height: 100%; background: #e5e5e5; }
        .page-view { display: none; position: absolute; top: var(--nav-h); width: 100%; height: calc(100vh - var(--nav-h)); background: white; z-index: 1500; padding: 50px; }

        /* BUTTONS */
        .btn-zoom { background: var(--accent); color: white; border: none; padding: 15px; width: 100%; font-weight: 900; cursor: pointer; text-transform: uppercase; margin-top: 15px; }
        .btn-report { background: #000; color: white; border: none; padding: 15px; width: 100%; font-weight: 900; cursor: pointer; text-transform: uppercase; margin-top: 10px; }

        footer { position: fixed; bottom: 0; width: 100%; background: #fff; border-top: 1px solid #eee; padding: 12px 30px; font-size: 10px; color: #bbb; z-index: 2001; display: flex; justify-content: space-between; }
    </style>
</head>
<body>

    <nav>
        <div class="logo" onclick="location.reload()">RESEARCH<span>DESK</span></div>
        <div class="nav-tabs">
            <button class="nav-btn active" onclick="showPage('gis')">01. GIS Analysis</button>
            <button class="nav-btn" onclick="showPage('inventory')">02. Inventory</button>
            <button class="nav-btn" onclick="showPage('comparison')">03. Comparison</button>
        </div>
    </nav>

    <div class="viewport" id="view-gis" style="display:flex;">
        <aside id="synthesis-station">
            <div class="ws-header"><h2 id="ws-title">Select Pin</h2></div>
            <div id="ws-body">
                <p style="color:#888; font-size:14px;">Click a marker to view site tags.</p>
            </div>
            
            <div id="analysis-controls" style="display:none;">
                <div class="control-panel">
                    <div class="toggle-row">
                        <span>Site Boundary (Red)</span>
                        <input type="checkbox" id="tog-bound" checked onchange="toggleLayers()">
                    </div>
                    <div class="toggle-row">
                        <span>Flood Risk (Blue)</span>
                        <input type="checkbox" id="tog-flood" checked onchange="toggleLayers()">
                    </div>
                </div>
                <button class="btn-report" onclick="alert('Report Generated')">Download Synthesis</button>
            </div>
        </aside>
        <div id="map"></div>
    </div>

    <div id="view-inventory" class="page-view"><h1>Inventory Database</h1><div id="inv-data"></div></div>
    <div id="view-comparison" class="page-view"><h1>Comparison Matrix</h1><div id="comp-data"></div></div>

    <footer>
        <span>&copy; 2026 ARCHITECTURAL RESEARCH DESK</span>
        <span>BRanding: Orange/White | CONTACT: RESEARCH@DESK.IE</span>
    </footer>

    <script src="database.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <script>
        let map, markers, borderLayer, floodLayer, activeSite = null;

        function init() {
            const data = (typeof siteData !== 'undefined') ? siteData : [];
            map = L.map('map', { zoomControl: false }).setView([53.4, -7.8], 7);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png').addTo(map);
            
            markers = L.layerGroup().addTo(map);
            borderLayer = L.layerGroup().addTo(map);
            floodLayer = L.layerGroup().addTo(map);

            data.forEach(s => {
                L.circleMarker(s.coords, { radius: 10, color: '#000', weight: 2, fillColor: '#ff6b00', fillOpacity: 1 })
                 .addTo(markers).on('click', () => showTags(s));
            });
        }

        function showTags(s) {
            activeSite = s;
            document.getElementById('analysis-controls').style.display = "none";
            document.getElementById('ws-title').innerText = s.name;
            document.getElementById('ws-body').innerHTML = `
                <div style="margin-bottom:15px;">
                    <span style="background:#eee; padding:4px 8px; font-size:10px; font-weight:800; margin-right:5px;">${s.bucket}</span>
                    <span style="background:#eee; padding:4px 8px; font-size:10px; font-weight:800;">${s.style}</span>
                </div>
                <p style="font-size:13px; color:#666;">${s.notes}</p>
                <button class="btn-zoom" onclick="zoomToSite()">Zoom to Site Analysis</button>
            `;
            // Clear any active layers when switching pins
            borderLayer.clearLayers();
            floodLayer.clearLayers();
        }

        function zoomToSite() {
            if(!activeSite) return;
            
            document.getElementById('analysis-controls').style.display = "block";
            map.flyTo(activeSite.coords, 18, { duration: 1.5 });

            // DRAW BOUNDARY (Red)
            borderLayer.clearLayers();
            if(activeSite.boundary) {
                L.polygon(activeSite.boundary, { color: 'red', weight: 3, fillOpacity: 0.1 }).addTo(borderLayer);
            }

            // DRAW FLOOD ZONE (Blue - offset slightly from boundary for demo)
            floodLayer.clearLayers();
            if(activeSite.boundary) {
                // For demo, we shrink the boundary slightly to represent a flood zone
                const floodZone = activeSite.boundary.slice(0, 3); 
                L.polygon(floodZone, { color: '#0077ff', weight: 0, fillOpacity: 0.4 }).addTo(floodLayer);
            }
        }

        function toggleLayers() {
            const bShow = document.getElementById('tog-bound').checked;
            const fShow = document.getElementById('tog-flood').checked;
            
            if(bShow) map.addLayer(borderLayer); else map.removeLayer(borderLayer);
            if(fShow) map.addLayer(floodLayer); else map.removeLayer(floodLayer);
        }

        function showPage(p) {
            document.querySelectorAll('.viewport, .page-view').forEach(v => v.style.display = 'none');
            document.getElementById('view-' + p).style.display = (p === 'gis') ? 'flex' : 'block';
            if(p === 'gis') setTimeout(() => map.invalidateSize(), 200);
        }

        window.onload = init;
    </script>
</body>
</html>
