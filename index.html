<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RESEARCH DESK | V4.7</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root { --accent: #ff6b00; --bg: #ffffff; --nav-h: 70px; --side: 320px; }
        body, html { margin: 0; padding: 0; font-family: 'Inter', sans-serif; height: 100%; overflow: hidden; background: #000; }

        /* TOP BLACK BAR (Unified Nav + Quick Links) */
        nav { 
            background: #111; color: white; display: flex; align-items: center; 
            padding: 0 25px; height: var(--nav-h); z-index: 1000; border-bottom: 1px solid #333;
        }
        .logo { font-weight: 900; cursor: pointer; font-size: 1.4rem; margin-right: 40px; }
        .logo span { color: var(--accent); }
        
        .quick-links { display: flex; gap: 15px; border-left: 1px solid #333; padding-left: 20px; margin-left: 20px; }
        .q-link { color: #888; font-size: 10px; text-decoration: none; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; transition: 0.3s; }
        .q-link:hover { color: var(--accent); }

        /* TOOLBAR (Toggle Controls) */
        .toolbar { 
            position: absolute; top: 90px; right: 20px; background: white; 
            z-index: 500; padding: 15px; border: 2px solid #000; box-shadow: 5px 5px 0px var(--accent);
        }
        .toolbar h4 { margin: 0 0 10px 0; font-size: 11px; text-transform: uppercase; color: var(--accent); }
        .toggle-btn { display: block; margin-bottom: 8px; font-size: 12px; cursor: pointer; font-weight: 600; }

        /* LAYOUT */
        .main-container { display: flex; height: calc(100vh - var(--nav-h)); }
        #sidebar { width: var(--side); background: #fff; border-right: 1px solid #eee; padding: 25px; overflow-y: auto; }
        #map { flex: 1; background: #222; }

        /* UI */
        .card { border-top: 5px solid var(--accent); background: #f9f9f9; padding: 20px; margin-bottom: 20px; border-radius: 0; }
        .primary-btn { background: var(--accent); color: white; border: none; padding: 15px; cursor: pointer; font-weight: 800; width: 100%; text-transform: uppercase; }
    </style>
</head>
<body>

    <nav>
        <div class="logo" onclick="location.reload()">RESEARCH<span>DESK</span></div>
        
        <div style="display:flex; gap:20px;">
            <button class="q-link" style="color:white; border-bottom: 2px solid var(--accent);">01. Master Map</button>
            <button class="q-link" onclick="alert('Inventory Active')">02. Inventory</button>
        </div>

        <div class="quick-links">
            <a href="https://www.buildingsofireland.ie/" target="_blank" class="q-link">NIAH</a>
            <a href="https://gis.teagasc.ie/soils/" target="_blank" class="q-link">Teagasc</a>
            <a href="https://www.floodinfo.ie/" target="_blank" class="q-link">Flood.ie</a>
            <a href="https://www.landdirect.ie/" target="_blank" class="q-link">LandDirect</a>
        </div>
    </nav>

    <div class="toolbar">
        <h4>Layers & Typology</h4>
        <label class="toggle-btn"><input type="checkbox" checked onchange="toggleLayer('pins')"> Site Markers</label>
        <label class="toggle-btn"><input type="checkbox" onchange="toggleType('ecclesiastical')"> Ecclesiastical</label>
        <label class="toggle-btn"><input type="checkbox" onchange="toggleType('museum')"> Museums</label>
        <hr style="border: 0; border-top: 1px solid #eee; margin: 10px 0;">
        <label class="toggle-btn"><input type="checkbox" id="flood-tog" onchange="toggleWMS('flood')"> Flood Overlays</label>
    </div>

    <div class="main-container">
        <div id="sidebar">
            <h2 id="site-title" style="margin-top:0;">Selection</h2>
            <div id="site-content">Click a site to view boundary & deeds.</div>
        </div>
        <div id="map"></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        let map, sites = [], markerGroup, boundaryGroup, floodWMS;

        async function initApp() {
            // Map Setup
            map = L.map('map', { zoomControl: false }).setView([53.4, -7.9], 7);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);

            markerGroup = L.layerGroup().addTo(map);
            boundaryGroup = L.layerGroup().addTo(map);

            // Fetch Data
            try {
                const res = await fetch('database.json');
                sites = await res.json();
                renderPins('all');
            } catch(e) { console.error("JSON missing. Create database.json first."); }
        }

        function renderPins(filter) {
            markerGroup.clearLayers();
            sites.forEach(s => {
                if (filter === 'all' || s.bucket.toLowerCase() === filter) {
                    const m = L.circleMarker(s.coords, { radius: 8, color: '#fff', fillColor: varColor(s.bucket), fillOpacity: 1 }).addTo(markerGroup);
                    m.on('click', () => selectSite(s));
                }
            });
        }

        function selectSite(s) {
            document.getElementById('site-title').innerText = s.name;
            document.getElementById('site-content').innerHTML = `
                <div class="card">
                    <p><strong>Deed Status:</strong> Registered</p>
                    <p><strong>Typology:</strong> ${s.bucket}</p>
                    <button class="primary-btn" onclick="alert('Opening Plan...')">View Folio Plan</button>
                </div>
            `;

            // Draw Polygon (The "Red Line" Boundary)
            boundaryGroup.clearLayers();
            if (s.boundary) {
                L.polygon(s.boundary, { color: 'red', weight: 2, fillOpacity: 0.2 }).addTo(boundaryGroup);
                map.flyTo(s.coords, 17); // Zoom in to see deeds
            }
        }

        function toggleType(type) {
            // Logic to filter pins based on ecclesiastical vs museum
            renderPins(type);
        }

        function varColor(type) {
            if(type.includes('Eccl')) return '#ff6b00';
            if(type.includes('Museum')) return '#27ae60';
            return '#3498db';
        }

        initApp();
    </script>
</body>
</html>
