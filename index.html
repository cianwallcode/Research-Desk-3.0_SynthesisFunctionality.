<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANALYSIS DASHBOARD | V4.1</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root { --bg: #ffffff; --accent: #ff6b00; --text: #1a1a1a; --border: #e0e0e0; --side-width: 60px; }
        body, html { margin: 0; padding: 0; font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); height: 100%; overflow: hidden; }

        /* --- LANDING --- */
        #page-landing { position: fixed; inset: 0; background: white; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }

        /* --- LAYOUT STRUCTURE --- */
        nav { background: #1a1a1a; color: white; display: none; align-items: center; padding: 0 20px; height: 60px; z-index: 1000; }
        .main-container { display: flex; height: calc(100vh - 60px); }
        
        /* LEFT RESOURCE BAR */
        .resource-bar { width: var(--side-width); background: #f4f4f4; border-right: 1px solid var(--border); display: flex; flex-direction: column; align-items: center; padding-top: 20px; gap: 20px; }
        .res-icon { width: 30px; height: 30px; background: #ddd; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 900; color: #666; cursor: pointer; text-decoration: none; transition: 0.2s; }
        .res-icon:hover { background: var(--accent); color: white; }

        .page-content { display: none; flex: 1; height: 100%; }
        .page-content.active { display: flex !important; }

        /* --- DASHBOARD UI --- */
        #sidebar { width: 300px; border-right: 1px solid var(--border); padding: 20px; overflow-y: auto; background: #fff; }
        .card { background: white; padding: 20px; border: 1px solid var(--border); border-top: 4px solid var(--accent); margin-bottom: 15px; }
        .primary-btn { background: var(--accent); color: white; border: none; padding: 12px 20px; cursor: pointer; font-weight: 800; text-transform: uppercase; width: 100%; }
        .badge { display: inline-block; padding: 4px 10px; font-size: 10px; font-weight: 900; color: white; border-radius: 20px; margin-bottom: 10px; }
        .badge-green { background: #27ae60; }
        .badge-red { background: #c0392b; }

        #map { flex: 1; z-index: 1; }
        .nav-tab { background: none; border: none; color: #888; cursor: pointer; font-size: 11px; font-weight: 700; text-transform: uppercase; padding: 10px; }
        .nav-tab.active { color: var(--accent); border-bottom: 2px solid var(--accent); }
    </style>
</head>
<body>

    <div id="page-landing">
        <h1 style="font-size: 4rem; letter-spacing: -3px; margin:0;">RESEARCH<span style="color:var(--accent)">DESK</span></h1>
        <p style="color:#aaa; letter-spacing:5px; margin-bottom:40px;">SITE DATA & ARCHITECTURAL SYNTHESIS</p>
        <button class="primary-btn" style="width:200px" onclick="initApp()">START PROJECT</button>
        <div style="position:absolute; bottom:40px; font-size:11px; color:#ccc;">© 2026 | STUDIO@RESEARCHDESK.IE</div>
    </div>

    <nav id="main-nav">
        <div style="font-weight: 900;">RESEARCH<span style="color:var(--accent)">DESK</span></div>
        <div style="margin-left:auto; display:flex; gap:10px;">
            <button class="nav-tab active" onclick="showPage('map')">Map</button>
            <button class="nav-tab" onclick="showPage('database')">Inventory</button>
            <button class="nav-tab" onclick="showPage('compare')">Comparison</button>
            <button class="nav-tab" onclick="showPage('synthesis')">Analysis Dashboard</button>
        </div>
    </nav>

    <div class="main-container">
        <aside class="resource-bar" id="res-bar" style="display:none;">
            <a href="https://www.buildingsofireland.ie/" target="_blank" class="res-icon" title="NIAH">NI</a>
            <a href="http://soils.teagasc.ie/" target="_blank" class="res-icon" title="Teagasc Soils">TG</a>
            <a href="https://www.floodinfo.ie/map/floodmaps/" target="_blank" class="res-icon" title="Flood Info">FL</a>
            <a href="https://www.archaeology.ie/" target="_blank" class="res-icon" title="Archaeology">AR</a>
        </aside>

        <div id="page-map" class="page-content active">
            <div id="sidebar">
                <h3 id="side-name">Selection</h3>
                <div id="side-info"><p style="color:#aaa;">Click a pin on the map to begin analysis.</p></div>
            </div>
            <div id="map"></div>
        </div>

        <div id="page-synthesis" class="page-content" style="padding:40px; background:#f9f9f9; flex-direction:column; overflow-y:auto;">
            <h2 id="syn-title">No Site Selected</h2>
            <div id="analysis-grid" style="display:grid; grid-template-columns: 1fr 1fr; gap:20px;"></div>
        </div>

        <div id="page-database" class="page-content" style="padding:40px; overflow-y:auto;">
            <table id="db-table" style="width:100%; border-collapse:collapse;"></table>
        </div>
        
        <div id="page-compare" class="page-content" style="padding:40px;">
            <div id="comp-ui" style="display:flex; width:100%; gap:20px;"></div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        let map, sites = [], selectedSite = null;

        async function initApp() {
            document.getElementById('page-landing').style.display = 'none';
            document.getElementById('main-nav').style.display = 'flex';
            document.getElementById('res-bar').style.display = 'flex';
            
            try {
                const resp = await fetch('database.json');
                sites = await resp.json();
                
                // Initialize Map with clean base
                map = L.map('map', {zoomControl: false}).setView([53.4, -7.9], 7);
                L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png').addTo(map);

                // LIVE OPW FLOOD WMS
                L.tileLayer.wms("https://maps.opw.ie/arcgis/services/Flood_Risk/Flood_Maps/MapServer/WMSServer", {
                    layers: '0', // Fluvial Risk
                    format: 'image/png',
                    transparent: true, opacity: 0.5
                }).addTo(map);

                // Render Pins
                sites.forEach(s => {
                    if(s.coords) {
                        L.circleMarker(s.coords, {radius:10, color:'white', fillColor:'#ff6b00', fillOpacity:1, weight:2})
                        .addTo(map).on('click', () => {
                            selectedSite = s;
                            document.getElementById('side-name').innerText = s.name;
                            document.getElementById('side-info').innerHTML = `
                                <div class="card">
                                    <p><strong>Status:</strong> ${s.status}</p>
                                    <button class="primary-btn" onclick="runAnalysis()">ANALYSIS DASHBOARD</button>
                                </div>`;
                        });
                    }
                });
            } catch (e) { console.error(e); }
        }

        function runAnalysis() {
            showPage('synthesis');
            const s = selectedSite;
            document.getElementById('syn-title').innerText = s.name;

            // OPPORTUNITY LOGIC
            // Note: Ensure your JSON has "flood_risk": "Low" or "High"
            const risk = s.flood_risk === "High";
            const derelict = s.status.toLowerCase() === "derelict";
            
            let conclusion = "";
            let badgeClass = "";

            if (!risk && derelict) {
                conclusion = "HIGH ADAPTIVE OPPORTUNITY. Site is derelict with zero flooding constraints. Ideal for internal structural insertion.";
                badgeClass = "badge-green";
            } else if (risk) {
                conclusion = "SIGNIFICANT CONSTRANT. Site falls within OPW Flood Zone. Any adaptive reuse will require flood resilient construction (tanking/raised floor).";
                badgeClass = "badge-red";
            } else {
                conclusion = "MODERATE. Site is currently active. Strategy should focus on preservation and efficiency upgrades.";
                badgeClass = "badge-red";
            }

            document.getElementById('analysis-grid').innerHTML = `
                <div class="card">
                    <span class="badge ${badgeClass}">${risk ? 'RISK' : 'OPPORTUNITY'}</span>
                    <h3>Strategic Conclusion</h3>
                    <p>${conclusion}</p>
                </div>
                <div class="card">
                    <h3>Site Metadata</h3>
                    <p>Typology: ${s.bucket}</p>
                    <p>Morphology: ${s.plan_type}</p>
                </div>
            `;
        }

        function showPage(id) {
            document.querySelectorAll('.page-content').forEach(p => p.classList.remove('active'));
            document.getElementById('page-' + id).classList.add('active');
            document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
            if(id === 'map') setTimeout(() => map.invalidateSize(), 200);
        }
    </script>
</body>
</html>
