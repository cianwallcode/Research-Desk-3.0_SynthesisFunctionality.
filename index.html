<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RESEARCH DESK | V5.3</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root { --accent: #ff6b00; --nav-h: 60px; --side: 360px; }
        body, html { margin: 0; padding: 0; font-family: 'Inter', sans-serif; height: 100%; background: #fff; overflow: hidden; }

        /* HEADER NAVIGATION */
        nav { 
            background: #000; color: white; display: flex; align-items: center; 
            padding: 0 25px; height: var(--nav-h); z-index: 1000; border-bottom: 1px solid #333;
        }
        .logo { font-weight: 900; cursor: pointer; font-size: 1.2rem; margin-right: 40px; }
        .logo span { color: var(--accent); }
        .nav-tabs { display: flex; gap: 20px; }
        .nav-link { color: #888; font-size: 11px; text-decoration: none; font-weight: 800; text-transform: uppercase; background: none; border: none; cursor: pointer; }
        .nav-link.active { color: white; border-bottom: 2px solid var(--accent); padding-bottom: 5px; }

        .portal-links { display: flex; gap: 15px; margin-left: auto; border-left: 1px solid #333; padding-left: 20px; }
        .p-link { color: #666; font-size: 10px; text-decoration: none; font-weight: 700; text-transform: uppercase; }
        .p-link:hover { color: var(--accent); }

        /* LAYOUT */
        .main-container { display: flex; height: calc(100vh - var(--nav-h)); flex-direction: column; }
        .workspace { display: flex; flex: 1; overflow: hidden; position: relative; }
        
        #sidebar { width: var(--side); background: #fff; border-right: 1px solid #eee; padding: 25px; overflow-y: auto; z-index: 10; }
        #map { flex: 1; background: #f4f4f4; }

        /* UI COMPONENTS */
        .toolbar { position: absolute; top: 20px; right: 20px; background: white; z-index: 500; padding: 15px; border: 2px solid #000; box-shadow: 6px 6px 0px var(--accent); width: 170px; }
        .site-card { border-top: 6px solid var(--accent); background: #fdfdfd; padding: 20px; margin-top: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .plan-preview { width: 100%; height: 200px; object-fit: contain; background: #eee; margin: 10px 0; border: 1px solid #ddd; }
        .primary-btn { background: var(--accent); color: white; border: none; padding: 14px; cursor: pointer; font-weight: 800; width: 100%; text-transform: uppercase; font-size: 10px; letter-spacing: 1px; }

        /* INVENTORY TABLE */
        #page-inventory { display:none; padding: 40px; background: white; width: 100%; overflow-y: auto; height: 100%; }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 15px; border-bottom: 2px solid var(--accent); font-size: 11px; color: var(--accent); }
        td { padding: 15px; border-bottom: 1px solid #eee; font-size: 13px; }

        footer { background: #f9f9f9; padding: 15px 25px; border-top: 1px solid #eee; display: flex; justify-content: space-between; font-size: 10px; color: #999; }
    </style>
</head>
<body>

    <nav>
        <div class="logo" onclick="location.reload()">RESEARCH<span>DESK</span></div>
        <div class="nav-tabs">
            <button class="nav-link active" id="btn-map" onclick="switchView('map')">01. Spatial Map</button>
            <button class="nav-link" id="btn-inv" onclick="switchView('inventory')">02. Inventory</button>
        </div>
        <div class="portal-links">
            <a href="https://www.landdirect.ie/" target="_blank" class="p-link">LandDirect</a>
            <a href="https://www.floodinfo.ie/" target="_blank" class="p-link">Flood.ie</a>
        </div>
    </nav>

    <div class="main-container">
        <div class="workspace">
            <div id="sidebar">
                <h2 id="side-title" style="margin:0; letter-spacing:-1px;">Site Analysis</h2>
                <div id="side-content">
                    <p style="color:#888; font-size:13px; line-height:1.6;">Select a site marker to visualize architectural boundaries and registry data.</p>
                </div>
            </div>

            <div id="map"></div>

            <div class="toolbar" id="map-toolbar">
                <p style="margin:0 0 10px 0; font-size:10px; font-weight:900; color:var(--accent); text-transform:uppercase;">Map Layers</p>
                <label style="display:flex; align-items:center; font-size:11px; font-weight:700; cursor:pointer;">
                    <input type="checkbox" id="tog-flood" onchange="toggleFlood()" style="margin-right:8px; accent-color:var(--accent);"> OPW Flood Risk
                </label>
            </div>

            <div id="page-inventory">
                <h1 style="margin-top:0;">Master Data Inventory</h1>
                <table>
                    <thead><tr><th>SITE NAME</th><th>TYPOLOGY</th><th>STYLE</th></tr></thead>
                    <tbody id="table-body"></tbody>
                </table>
            </div>
        </div>

        <footer>
            <span>&copy; 2026 ARCHITECTURAL RESEARCH DESK</span>
            <span>CONTACT: RESEARCH@DESK.IE | IRELAND</span>
        </footer>
    </div>

    <script src="database.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <script>
        let map, markerGroup, boundaryGroup, floodLayer;

        // FALLBACK DATA: This ensures the map works even if database.js fails
        const fallbackData = [
            {
                "name": "Demo: Mellifont Abbey",
                "bucket": "Cistercian",
                "style": "Romanesque",
                "coords": [53.7424, -6.4651],
                "boundary": [[53.7431, -6.4665], [53.7435, -6.4645], [53.7418, -6.4638], [53.7415, -6.4658]],
                "plan_url": "https://placehold.co/600x400?text=Mellifont+Plan",
                "notes": "Sample data used because database.js was not found."
            }
        ];

        function init() {
            // Use external data if available, otherwise use fallback
            const activeData = (typeof siteData !== 'undefined') ? siteData : fallbackData;

            map = L.map('map', { zoomControl: false }).setView([53.4, -7.8], 7);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png').addTo(map);
            
            markerGroup = L.layerGroup().addTo(map);
            boundaryGroup = L.layerGroup().addTo(map);

            floodLayer = L.tileLayer.wms("https://maps.opw.ie/arcgis/services/Flood_Risk/Flood_Maps/MapServer/WMSServer", {
                layers: '0', format: 'image/png', transparent: true, opacity: 0.4, version: '1.1.1'
            });

            renderPoints(activeData);
            renderTable(activeData);
        }

        function renderPoints(data) {
            markerGroup.clearLayers();
            data.forEach(s => {
                L.circleMarker(s.coords, { radius: 10, color: '#000', weight: 2, fillColor: '#ff6b00', fillOpacity: 1 })
                 .addTo(markerGroup)
                 .on('click', () => {
                    document.getElementById('side-title').innerText = s.name;
                    document.getElementById('side-content').innerHTML = `
                        <div class="site-card">
                            <p style="font-size:10px; font-weight:900; color:var(--accent); text-transform:uppercase;">${s.bucket}</p>
                            <img src="${s.plan_url}" class="plan-preview" onerror="this.src='https://placehold.co/400x300?text=Plan+Missing';">
                            <p style="font-size:12px; color:#666; margin-bottom:20px;">${s.notes || ''}</p>
                            <button class="primary-btn" onclick="window.open('https://www.landdirect.ie','_blank')">Start Project</button>
                        </div>`;
                    
                    boundaryGroup.clearLayers();
                    if(s.boundary) {
                        L.polygon(s.boundary, { color: 'red', weight: 3, fillOpacity: 0.1 }).addTo(boundaryGroup);
                        map.flyTo(s.coords, 17);
                    }
                 });
            });
        }

        function toggleFlood() {
            if(document.getElementById('tog-flood').checked) floodLayer.addTo(map);
            else map.removeLayer(floodLayer);
        }

        function renderTable(data) {
            document.getElementById('table-body').innerHTML = data.map(s => `
                <tr><td>${s.name}</td><td>${s.bucket}</td><td>${s.style}</td></tr>
            `).join('');
        }

        function switchView(view) {
            const isMap = view === 'map';
            document.getElementById('map').style.display = isMap ? 'block' : 'none';
            document.getElementById('sidebar').style.display = isMap ? 'block' : 'none';
            document.getElementById('map-toolbar').style.display = isMap ? 'block' : 'none';
            document.getElementById('page-inventory').style.display = isMap ? 'none' : 'block';
            document.getElementById('btn-map').classList.toggle('active', isMap);
            document.getElementById('btn-inv').classList.toggle('active', !isMap);
            if(isMap) setTimeout(() => map.invalidateSize(), 100);
        }

        window.onload = init;
    </script>
</body>
</html>
