<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RESEARCH DESK | V5.2</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        /* BRANDING: ORANGE AND WHITE */
        :root { 
            --accent: #ff6b00; 
            --bg: #ffffff; 
            --nav-h: 60px; 
            --side: 360px; 
            --text: #1a1a1a;
        }

        body, html { 
            margin: 0; padding: 0; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            height: 100%; background: var(--bg); color: var(--text);
        }

        /* TOP BLACK NAVIGATION BAR */
        nav { 
            background: #000; color: white; display: flex; align-items: center; 
            padding: 0 25px; height: var(--nav-h); z-index: 1000; position: fixed; top: 0; width: 100%;
        }
        .logo { font-weight: 900; cursor: pointer; font-size: 1.2rem; margin-right: 40px; }
        .logo span { color: var(--accent); }
        
        .nav-tabs { display: flex; gap: 20px; }
        .nav-link { color: #888; font-size: 11px; text-decoration: none; font-weight: 800; text-transform: uppercase; background: none; border: none; cursor: pointer; padding: 5px 0; }
        .nav-link.active { color: white; border-bottom: 2px solid var(--accent); }

        .portal-links { display: flex; gap: 15px; margin-left: auto; border-left: 1px solid #333; padding-left: 20px; margin-right: 50px; }
        .p-link { color: #666; font-size: 10px; text-decoration: none; font-weight: 700; text-transform: uppercase; transition: 0.2s; }
        .p-link:hover { color: var(--accent); }

        /* MAIN CONTENT AREA */
        .main-wrapper { display: flex; flex-direction: column; height: 100vh; padding-top: var(--nav-h); }
        .content-body { display: flex; flex: 1; overflow: hidden; }

        /* SIDEBAR (SCROLLABLE) */
        #sidebar { 
            width: var(--side); background: #fff; border-right: 1px solid #eee; 
            padding: 25px; overflow-y: auto; z-index: 10;
        }

        /* MAP AREA */
        #map { flex: 1; background: #f0f0f0; }

        /* FLOATING TOOLBAR */
        .toolbar { 
            position: absolute; top: 80px; right: 20px; background: white; 
            z-index: 500; padding: 15px; border: 2px solid #000; 
            box-shadow: 6px 6px 0px var(--accent); width: 180px; 
        }
        .toolbar h4 { margin: 0 0 10px 0; font-size: 10px; text-transform: uppercase; color: var(--accent); }
        .toggle-item { display: flex; align-items: center; margin-bottom: 8px; font-size: 11px; font-weight: 700; cursor: pointer; }

        /* CARDS & BUTTONS */
        .site-card { border-top: 6px solid var(--accent); background: #fdfdfd; padding: 20px; margin-top: 20px; }
        .plan-preview { width: 100%; height: 220px; object-fit: contain; border: 1px solid #ddd; margin: 15px 0; background: #fff; }
        .primary-btn { background: var(--accent); color: white; border: none; padding: 14px; cursor: pointer; font-weight: 800; width: 100%; text-transform: uppercase; font-size: 11px; }

        /* INVENTORY VIEW */
        #page-inventory { display:none; padding: 40px; background: white; width: 100%; overflow-y: auto; }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 12px; border-bottom: 2px solid var(--accent); font-size: 11px; color: var(--accent); }
        td { padding: 12px; border-bottom: 1px solid #eee; font-size: 13px; }

        /* FOOTER FOR LANDING PAGE */
        footer { 
            background: #f9f9f9; padding: 20px; border-top: 1px solid #eee; 
            text-align: center; font-size: 10px; color: #999; text-transform: uppercase;
        }
    </style>
</head>
<body>

    <nav>
        <div class="logo" onclick="location.reload()">RESEARCH<span>DESK</span></div>
        <div class="nav-tabs">
            <button class="nav-link active" id="btn-map" onclick="switchView('map')">01. Spatial Map</button>
            <button class="nav-link" id="btn-inv" onclick="switchView('inventory')">02. Inventory</button>
        </div>
        <div class="portal-links">
            <a href="https://www.buildingsofireland.ie/" target="_blank" class="p-link">NIAH</a>
            <a href="http://soils.teagasc.ie/" target="_blank" class="p-link">TEAGASC</a>
            <a href="https://www.floodinfo.ie/" target="_blank" class="p-link">FLOOD.IE</a>
            <a href="https://www.landdirect.ie/" target="_blank" class="p-link">LANDDIRECT</a>
        </div>
    </nav>

    <div class="main-wrapper">
        <div class="content-body">
            <div id="sidebar">
                <h2 id="side-title" style="margin-top:0;">Site Analysis</h2>
                <div id="side-content">
                    <p>Select a site on the map to begin.</p>
                </div>
            </div>

            <div id="map"></div>

            <div class="toolbar" id="map-toolbar">
                <h4>Filters</h4>
                <div id="filter-controls"></div>
                <h4 style="margin-top:15px;">Layers</h4>
                <label class="toggle-item"><input type="checkbox" id="tog-flood" onchange="toggleFlood()"> Flood Risk (OPW)</label>
            </div>

            <div id="page-inventory">
                <h2>Project Master Inventory</h2>
                <table>
                    <thead><tr><th>NAME</th><th>TYPOLOGY</th><th>STYLE</th><th>STATUS</th></tr></thead>
                    <tbody id="table-body"></tbody>
                </table>
            </div>
        </div>

        <footer>
            &copy; 2026 Architectural Research Desk | Contact: research@desk.ie | Irish Heritage Spatial Data
        </footer>
    </div>

    <script src="database.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <script>
        let map, markerGroup, boundaryGroup, floodLayer;

        function init() {
            if (typeof siteData === 'undefined') {
                document.getElementById('side-content').innerHTML = "<b>database.js not found.</b>";
                return;
            }

            map = L.map('map', { zoomControl: false }).setView([53.4, -7.8], 7);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png').addTo(map);
            
            markerGroup = L.layerGroup().addTo(map);
            boundaryGroup = L.layerGroup().addTo(map);

            floodLayer = L.tileLayer.wms("https://maps.opw.ie/arcgis/services/Flood_Risk/Flood_Maps/MapServer/WMSServer", {
                layers: '0', format: 'image/png', transparent: true, opacity: 0.4, version: '1.1.1'
            });

            populateFilters();
            renderMap();
            renderTable();
        }

        function populateFilters() {
            const buckets = [...new Set(siteData.map(s => s.bucket))];
            document.getElementById('filter-controls').innerHTML = buckets.map(b => `
                <label class="toggle-item"><input type="checkbox" checked value="${b}" onchange="renderMap()"> ${b}</label>
            `).join('');
        }

        function renderMap() {
            markerGroup.clearLayers();
            const active = Array.from(document.querySelectorAll('#filter-controls input:checked')).map(i => i.value);
            siteData.forEach(s => {
                if(active.includes(s.bucket)) {
                    L.circleMarker(s.coords, { radius: 10, color: '#000', weight: 2, fillColor: varColor(s.bucket), fillOpacity: 1 })
                     .addTo(markerGroup)
                     .on('click', () => focusSite(s));
                }
            });
        }

        function focusSite(s) {
            document.getElementById('side-title').innerText = s.name;
            document.getElementById('side-content').innerHTML = `
                <div class="site-card">
                    <p style="font-size:10px; font-weight:800; color:var(--accent);">${s.bucket.toUpperCase()}</p>
                    <img src="${s.plan_url}" class="plan-preview" onerror="this.onerror=null; this.src='https://placehold.co/400x300?text=Plan+Missing';">
                    <p><strong>Plan Type:</strong> ${s.plan_type}</p>
                    <button class="primary-btn" onclick="window.open('https://www.landdirect.ie','_blank')">Start Project</button>
                </div>`;
            
            boundaryGroup.clearLayers();
            if(s.boundary) {
                L.polygon(s.boundary, { color: 'red', weight: 3, fillOpacity: 0.1 }).addTo(boundaryGroup);
                map.flyTo(s.coords, 17);
            }
        }

        function varColor(type) {
            const colors = { 'Cistercian': '#ff6b00', 'Museum': '#27ae60', 'Benedictine': '#8e44ad', 'Modernist': '#3498db' };
            return colors[type] || '#888';
        }

        function toggleFlood() {
            if(document.getElementById('tog-flood').checked) floodLayer.addTo(map);
            else map.removeLayer(floodLayer);
        }

        function renderTable() {
            document.getElementById('table-body').innerHTML = siteData.map(s => `
                <tr><td>${s.name}</td><td>${s.bucket}</td><td>${s.style}</td><td>${s.status}</td></tr>
            `).join('');
        }

        function switchView(view) {
            const isMap = view === 'map';
            document.getElementById('map').style.display = isMap ? 'block' : 'none';
            document.getElementById('sidebar').style.display = isMap ? 'block' : 'none';
            document.getElementById('map-toolbar').style.display = isMap ? 'block' : 'none';
            document.getElementById('page-inventory').style.display = isMap ? 'none' : 'block';
            document.getElementById('btn-map').classList.toggle('active', isMap);
            document.getElementById('btn-inv').classList.toggle('active', !isMap);
            if(isMap) setTimeout(() => map.invalidateSize(), 200);
        }

        init();
    </script>
</body>
</html>
